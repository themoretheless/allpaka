name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    env:
      # `.cargo/config.toml` sets `-C target-cpu=native` for
      # aarch64-apple-darwin, and those rustflags reach ordinary host builds. On
      # the runner that leaves the compile-time feature set below ring 0.17.14's
      # static minimum, so the build aborts in ring's
      # `assert!((CAPS_STATIC & MIN_STATIC_FEATURES) == MIN_STATIC_FEATURES)`
      # (`src/cpu/arm/darwin.rs:44`). Locally the same assert reproduces with
      # `-C target-cpu=generic` (leaves only `neon`), while the target default -
      # what an empty `RUSTFLAGS` falls back to - builds ring and still carries
      # the `neon` that `backend/src/ops.rs` intrinsics need. Test builds gain
      # nothing from native tuning.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        # `rust-toolchain.toml` wins over this for every later step, so the
        # workspace is built by nightly; stable only sets the rustup default.
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo test --workspace
        run: cargo test --workspace
        # plugin_smoke skips its engine/RAG cases gracefully: CI runners have
        # neither the GGUF models nor the rag-mcp binary + DuckDB. Unit tests
        # and everything not needing local data still run. To cover the smoke
        # tests too, run this workflow on a self-hosted runner that has
        # models/qwen3-0.6b-Q8_0.gguf and RAG_MCP_BIN/RAG_DB_PATH set.

