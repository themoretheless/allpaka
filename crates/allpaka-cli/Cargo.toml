[package]
name = "allpaka-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "allpaka"
path = "src/main.rs"

[features]
default = ["cuda", "airbug"]
cuda = ["allpaka-backend/cuda", "allpaka-model/cuda"]
airbug = ["dep:airbug-otel", "dep:airbug-bench"]

[dependencies]
allpaka-chat.workspace = true
allpaka-core.workspace = true
allpaka-gguf.workspace = true
allpaka-backend = { workspace = true }
allpaka-model = { workspace = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
airbug-otel = { workspace = true, optional = true }
airbug-bench = { workspace = true, optional = true }
airbug.workspace = true
